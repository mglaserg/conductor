[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-trading"
version = "0.4.0a6"
description = "Portfolio control plane and strategy runtime for multi-strategy trading"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Conductor"}]
dependencies = [
    "pydantic>=2.8,<3",
    "nautilus_trader==2.0.0rc4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
]
allocation = ["numpy>=2.0", "scipy>=1.13", "scikit-learn>=1.5"]
dashboard = ["streamlit>=1.39,<2", "pandas>=2.2,<3"]

[project.scripts]
conductor = "conductor.command:main"
conductor-demo = "conductor.cli:main"
conductor-nautilus-smoke = "conductor.adapters.nautilus:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
