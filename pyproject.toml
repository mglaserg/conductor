[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-trading"
version = "0.3.0"
description = "Portfolio control plane and strategy runtime for multi-strategy trading"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Conductor"}]
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Keep NautilusTrader optional while v2 remains pre-release.
nautilus = ["nautilus_trader>=2.0.0rc0,<3"]

[project.scripts]
conductor = "conductor.command:main"
conductor-demo = "conductor.cli:main"
conductor-nautilus-smoke = "conductor.adapters.nautilus:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
