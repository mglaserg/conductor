# Conductor V0.4 alpha — Windows ETSA/RPSchteroids/TLAQ multi-account template.
# SAFE DEFAULT: workers connect to IBKR for real state/prices, but Conductor never enqueues live
# orders until live_orders_enabled=true on the relevant route.

[node]
id = "windows-main"
state_db = "data/conductor.sqlite"
run_root = "data/runs"

# -----------------------------------------------------------------------------
# CAPITAL POOLS
#
# One named portfolio per independently funded route/account. Unless `nav = <number>` is supplied,
# each pool uses that route's broker NetLiquidation. The pool name and route ID intentionally match.
# -----------------------------------------------------------------------------

[portfolio.ibkr_main]
allocator = "static"

[portfolio.ibkr_main.static.weights]
ETSA = 0.85
RPSchteroids = 0.15

[portfolio.ibkr_main.fallback]
order = ["erc", "inverse_vol", "static"]

[portfolio.ibkr_tlaq]
allocator = "static"

[portfolio.ibkr_tlaq.static.weights]
TLAQ = 1.0

# Offline `--paper` NAVs only; live/shadow continues to use each broker route's NetLiquidation.
[paper]
default_price = 100

[paper.portfolio_navs]
ibkr_main = 100000
ibkr_tlaq = 100000

# Existing ETSA/RPS implementation band. Capital is now supplied by portfolio.ibkr_main rather than
# hand-entered strategy seed capital.
[sleeves.etsa_rps]
portfolio_weight = 1.0
leverage = 1.0
rebalance_band = 0.025
strategy_weights = { ETSA = 0.85, RPSchteroids = 0.15 }

[sleeves.tlaq]
portfolio_weight = 1.0
leverage = 1.0
rebalance_band = 0.0
strategy_weights = { TLAQ = 1.0 }

[risk]
# Defaults inherited by every named capital pool. Override under
# [portfolio.<route_id>.risk] when one account needs different limits.
max_gross_leverage = 2.0
max_net_exposure = 1.0
max_instrument_nav = 0.20
max_margin_utilization = 0.60

[execution]
min_trade_nav_bps = 1

# -----------------------------------------------------------------------------
# MAIN IBKR ACCOUNT — ETSA + RPSCHTEROIDS
# -----------------------------------------------------------------------------

[routes.ibkr_main]
adapter = "nautilus_ibkr"
account = "REPLACE_WITH_MAIN_IBKR_ACCOUNT"
host = "127.0.0.1"
port = 7497
data_client_id = 1301
exec_client_id = 1302
market_data_type = "REALTIME"
preload_instruments = []
bridge_db = "data/ibkr_main_nautilus_bridge.sqlite"
instrument_cache_path = "data/ibkr_instruments.json"
worker_stale_after_seconds = 15
request_timeout_seconds = 180
order_timeout_seconds = 30
live_orders_enabled = false

# -----------------------------------------------------------------------------
# TLAQ IBKR ACCOUNT — independent capital pool
# -----------------------------------------------------------------------------

[routes.ibkr_tlaq]
adapter = "nautilus_ibkr"
account = "REPLACE_WITH_TLAQ_IBKR_ACCOUNT"
host = "127.0.0.1"
port = 7497
data_client_id = 1311
exec_client_id = 1312
market_data_type = "REALTIME"
preload_instruments = []
bridge_db = "data/ibkr_tlaq_nautilus_bridge.sqlite"
instrument_cache_path = "data/ibkr_instruments.json"
worker_stale_after_seconds = 15
request_timeout_seconds = 180
order_timeout_seconds = 30
live_orders_enabled = false

[strategies.ETSA]
sleeve_id = "etsa_rps"
result_mode = "target_weights"
route_id = "ibkr_main"
cwd = "C:/Trading/Yautja-Orchestra"
command = ["uv", "run", "python", "etsa_conductor_adapter.py"]
timeout_seconds = 600
[strategies.ETSA.seed]
# Bootstrap ownership/cash only. Allocated capital comes from 85% of ibkr_main broker NAV.
cash = 0
positions = {}

[strategies.RPSchteroids]
sleeve_id = "etsa_rps"
result_mode = "target_quantities"
route_id = "ibkr_main"
cwd = "C:/Trading/RPSchteroids"
command = ["uv", "run", "python", "rpschteroids_conductor_adapter.py"]
timeout_seconds = 600
[strategies.RPSchteroids.environment]
RPS_TARGET_CALLABLE = "REPLACE.module:target_positions"
[strategies.RPSchteroids.seed]
cash = 0
positions = {}

[strategies.TLAQ]
sleeve_id = "tlaq"
result_mode = "position_deltas"
route_id = "ibkr_tlaq"
cwd = "C:/Trading/TLAQ"
command = ["uv", "run", "python", "tlaq_conductor_adapter.py"]
timeout_seconds = 600
[strategies.TLAQ.environment]
TLAQ_DELTA_CALLABLE = "REPLACE.module:trade_deltas"
[strategies.TLAQ.seed]
# TLAQ cash may legitimately be negative; that represents strategy financing.
cash = 0
positions = {}
